name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - name: Install locked development dependencies
        run: uv sync --locked --python 3.14 --dev
      - name: Ruff and MyPy
        run: make lint-ci

  test:
    runs-on: ubuntu-latest
    env:
      APP_DB_DSN: postgresql+asyncpg://app:app@127.0.0.1:5432/app
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - name: Install locked development dependencies
        run: uv sync --locked --python 3.14 --dev
      - name: Apply existing migrations
        run: make local-apply-migrations
      - name: Full test suite and coverage
        run: make test-ci
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
