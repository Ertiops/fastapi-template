services:
  db:
    image: postgres:16
    restart: on-failure:5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local DB password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app"]
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_TITLE: ${APP_TITLE:-App}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-FastAPI greenfield template}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_SECRET: ${APP_SECRET:?Set a local application secret}
      APP_REST_HOST: "0.0.0.0"
      APP_REST_PORT: "8080"
      APP_DB_DSN: "postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}"

volumes:
  postgres_data:
